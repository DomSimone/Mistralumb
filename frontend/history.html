<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat History - Umbuzo</title>
    <link rel="icon" type="image/png" href="Mbuzo.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="top-nav">
        <div class="nav-container">
            <div class="nav-left">
                <a href="index.html" class="nav-logo-link">
                    <img src="Mbuzo.png" alt="Umbuzo" class="nav-logo">
                    <span class="nav-brand">Umbuzo</span>
                </a>
            </div>
            <div class="nav-center">
                <a href="index.html" class="nav-link">Chat</a>
                <a href="history.html" class="nav-link active">History</a>
                <a href="apps.html" class="nav-link">Apps</a>
            </div>
            <div class="nav-right">
                <button class="btn-signin" onclick="window.location.href='signin.html'">Sign In</button>
                <button class="btn-signup" onclick="window.location.href='signup.html'">Sign Up</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="history-main">
        <div class="history-container">
            <div class="history-header">
                <h1>Chat History</h1>
                <button class="btn-clear-history" id="btnClearHistory">Clear All</button>
            </div>

            <div class="history-filters">
                <input type="text" class="search-input" id="searchInput" placeholder="Search conversations...">
                <select class="filter-select" id="filterSelect">
                    <option value="all">All Chats</option>
                    <option value="today">Today</option>
                    <option value="week">This Week</option>
                    <option value="month">This Month</option>
                </select>
            </div>

            <div class="history-list" id="historyList">
                <!-- Dynamically populated -->
            </div>

            <div class="empty-state" id="emptyState" style="display: none;">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                <h2>No chat history</h2>
                <p>Start a new conversation to see it here</p>
                <button class="btn-primary" onclick="window.location.href='index.html'">New Chat</button>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="history.js"></script>
</body>
</html>
