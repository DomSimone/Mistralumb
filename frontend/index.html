<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umbuzo - AI Assistant</title>
    <link rel="icon" type="image/png" href="/Mbuzo.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="top-nav">
        <div class="nav-container">
            <div class="nav-left">
                <a href="index.html" class="nav-logo-link">
                    <img src="/Mbuzo.png" alt="Umbuzo" class="nav-logo">
                    <span class="nav-brand">Umbuzo</span>
                </a>
            </div>
            <div class="nav-center">
                <a href="index.html" class="nav-link active">Chat</a>
                <a href="history.html" class="nav-link">History</a>
                <a href="apps.html" class="nav-link">Apps</a>
            </div>
            <div class="nav-right">
                <div class="user-status" id="userStatus">
                    <!-- User status will be updated by JavaScript -->
                </div>
                <button class="btn-signin" onclick="window.location.href='signin.html'">Sign In</button>
                <button class="btn-signup" onclick="window.location.href='signup.html'">Sign Up</button>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <aside class="sidebar">
        <button class="btn-new-chat" id="btnNewChat">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>New Chat</span>
        </button>

        <div class="chat-history-section">
            <h3 class="sidebar-title">Recent Chats</h3>
            <div class="chat-history-list" id="chatHistoryList">
                <!-- Dynamically populated -->
            </div>
        </div>

        <div class="sidebar-footer">
            <a href="apps.html" class="sidebar-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                <span>Apps & Tools</span>
            </a>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="main-content">
        <div class="chat-container" id="chatContainer">
            <!-- Welcome Message -->
            <div class="welcome-section" id="welcomeSection">
                <div class="welcome-logo">
                    <img src="/Mbuzo.png" alt="Umbuzo" class="main-logo">
                </div>
                <h1 class="welcome-title">Umbuzo</h1>
                <p class="welcome-subtitle">AI Assistant with Critical Analysis & Mathematical Reasoning</p>
                <div class="capabilities-list">
                    <div class="capability-item">
                        <span class="capability-icon">🧠</span>
                        <span>Critical Analysis</span>
                    </div>
                    <div class="capability-item">
                        <span class="capability-icon">🔢</span>
                        <span>Mathematical Reasoning</span>
                    </div>
                    <div class="capability-item">
                        <span class="capability-icon">🔬</span>
                        <span>Scientific Inquiry</span>
                    </div>
                    <div class="capability-item">
                        <span class="capability-icon">📚</span>
                        <span>RAG-Powered Responses</span>
                    </div>
                </div>
            </div>

            <!-- Chat Messages -->
            <div class="messages-container" id="messagesContainer" style="display: none;">
                <!-- Messages will be dynamically added here -->
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-container">
            <div class="input-wrapper">
                <button class="btn-attach" id="btnAttach" title="Attach file">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                    </svg>
                </button>
                
                <input 
                    type="text" 
                    class="chat-input" 
                    id="chatInput" 
                    placeholder="Ask Umbuzo anything..."
                    autocomplete="off"
                >
                
                <div class="model-selector-wrapper">
                    <select class="model-selector" id="modelSelector">
                        <option value="auto">Auto</option>
                        <option value="factual">Factual</option>
                        <option value="reasoning">Reasoning</option>
                        <option value="creative">Creative</option>
                    </select>
                </div>

                <button class="btn-send" id="btnSend" title="Send message">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="loading-spinner"></div>
        <p>Umbuzo is thinking...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="config.js"></script>
    <script src="extensions.js"></script>
    <script src="extensions-ui.js"></script>
    <script src="app.js"></script>
</body>
</html>
